name: test

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
        include:
          - os: ubuntu-latest
            node: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The profile checks source the block in every real shell that is installed. The runners have bash and PowerShell 7;
      # zsh and fish are added where they are missing. If an install fails the checks for that shell skip.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
        continue-on-error: true
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
        continue-on-error: true
      - run: node --version && git --version
      - run: npm test

  # The package as npm would install it: the tarball holds every file the command needs, and the command it links starts.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pack, install the tarball globally, run the command
        shell: bash
        run: |
          npm pack --silent
          npm install -g ./claude-relocate-*.tgz
          claude-relocate --version
          claude-relocate --help > /dev/null
